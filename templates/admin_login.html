<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fb;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            margin: 100px auto;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
            text-align: center;
        }

        h1 {
            color: #0b6e8e;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            background: #0b6e8e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #075b75;
        }

        .error {
            color: red;
            margin-top: 15px;
        }

        a {
            display: block;
            margin-top: 20px;
            color: #0b6e8e;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🏥 Admin Login</h1>

        <p>City Care Hospital</p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <a href="/">
            ← Back to Home
        </a>

    </div>

</body>

</html>
