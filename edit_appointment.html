<!DOCTYPE html>

<html>

<head>

    <title>Edit Appointment</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f8fb;
        }

        header {
            background: #0b6e8e;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .form-box {
            width: 650px;
            max-width: 90%;
            background: white;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            text-align: center;
            color: #0b6e8e;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #0b6e8e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #075b75;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0b6e8e;
            text-decoration: none;
        }

    </style>

</head>

<body>

<header>

    <h1>🏥 City Care Hospital</h1>

    <p>Edit Appointment</p>

</header>


<div class="form-box">

    <h2>✏️ Update Appointment</h2>

    <form
        method="POST"
        action="/admin/update-appointment/{{ appointment['id'] }}"
    >

        <label>Patient Name</label>

        <input
            type="text"
            name="patient_name"
            value="{{ appointment['patient_name'] }}"
            required
        >


        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ appointment['phone'] }}"
            required
        >


        <label>Doctor</label>

        <input
            type="text"
            name="doctor"
            value="{{ appointment['doctor'] }}"
            required
        >


        <label>Appointment Date</label>

        <input
            type="date"
            name="appointment_date"
            value="{{ appointment['appointment_date'] }}"
            required
        >


        <label>Appointment Time</label>

        <input
            type="time"
            name="appointment_time"
            value="{{ appointment['appointment_time'] }}"
            required
        >


        <label>Reason</label>

        <textarea
            name="reason"
            required
        >{{ appointment['reason'] }}</textarea>


        <button type="submit">
            💾 Update Appointment
        </button>

    </form>


    <a
        href="/admin"
        class="back"
    >
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
