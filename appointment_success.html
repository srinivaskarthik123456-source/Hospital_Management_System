<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Appointment Successful</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f4f8fb;
        }

        header {
            background-color: #0b6e8e;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .box {
            width: 650px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            color: green;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        .button {
            display: inline-block;
            background-color: #0b6e8e;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            margin: 15px 8px;
            border-radius: 6px;
        }

        .button:hover {
            background-color: #075b75;
        }

    </style>

</head>


<body>

    <header>

        <h1>🏥 City Care Hospital</h1>

        <nav>

            <a href="/">Home</a>

            <a href="/doctors">Doctors</a>

            <a href="/appointments">Appointments</a>

        </nav>

    </header>


    <div class="box">

        <h2>✅ Appointment Booked Successfully!</h2>

        <p>
            Your appointment has been saved successfully.
        </p>

        <p>
            Please visit the hospital at your selected date and time.
        </p>


        <a href="/appointments" class="button">
            Book Another Appointment
        </a>


        <a href="/" class="button">
            Back to Home
        </a>

    </div>

</body>

</html>
